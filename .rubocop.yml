AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - 'bin/fontello'
    - 'fontello_rails_converter.gemspec'
    - 'spec/dummy_rails_root/**/*'
    - 'spec/fixtures/**/*'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/MutableConstant:
  Enabled: false

Style/GuardClause:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Layout/LineLength:
  Max: 150

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/ClassLength:
  Exclude:
    - 'lib/fontello_rails_converter/cli.rb'

Metrics/MethodLength:
  Exclude:
    - 'lib/fontello_rails_converter/cli.rb'

Metrics/AbcSize:
  Exclude:
    - 'lib/fontello_rails_converter/cli.rb'

Lint/IneffectiveAccessModifier:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false
