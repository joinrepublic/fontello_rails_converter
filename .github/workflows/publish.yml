name: Publish

on:
  workflow_run:
    workflows:
      - Release
    branches:
      - master
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC login to AWS CodeArtifact

jobs:
  guard:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.check_jobs.outputs.release_created }}
    steps:
      - name: Check release-please job conclusion
        id: check_jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONCLUSION=$(gh api \
            "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            | jq -r '[.jobs[] | select(.name == "release-please")] | first | .conclusion // "skipped"')
          echo "Release run ${{ github.event.workflow_run.id }} → release-please conclusion: ${CONCLUSION}"
          if [ "$CONCLUSION" = "success" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

  publish-gem:
    needs: [ guard ]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && needs.guard.outputs.release_created == 'true'))
    runs-on: ubuntu-latest

    env:
      CODEARTIFACT_REPOSITORY: https://republic-570660171057.d.codeartifact.us-east-1.amazonaws.com/ruby/ruby-joinrepublic

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Ruby environment
        uses: ./.github/actions/setup-ruby-env
        with:
          ruby-version: '3.3'
          bundler-cache: true
          aws-role-arn: ${{ vars.AWS_CODEARTIFACT_PUBLISH_ROLE_ARN }}

      - name: Resolve gem version from gemspec
        id: gem_version
        run: |
          VERSION=$(ruby -e "spec = Gem::Specification.load('fontello_rails_converter.gemspec'); puts spec.version.to_s")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure RubyGems credentials for AWS CodeArtifact
        run: |
          mkdir -p "$HOME/.gem"
          echo ":codeartifact_api_key: Bearer ${CODEARTIFACT_AUTH_TOKEN}" > "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"

      - name: Check whether version is already published
        id: publish_guard
        env:
          VERSION: ${{ steps.gem_version.outputs.version }}
        run: |
          if gem list '^fontello_rails_converter$' -ra --source "https://aws:${CODEARTIFACT_AUTH_TOKEN}@${CODEARTIFACT_REPOSITORY#https://}" | grep -Eq "\(${VERSION}(,|\))"; then
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already exists in AWS CodeArtifact. Skipping publish."
          else
            echo "publish_needed=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not published yet. Proceeding."
          fi

      - name: Build gem
        if: steps.publish_guard.outputs.publish_needed == 'true'
        run: gem build fontello_rails_converter.gemspec

      - name: Publish gem to AWS CodeArtifact
        if: steps.publish_guard.outputs.publish_needed == 'true'
        run: |
          GEM_FILE=$(ls -1 *.gem | head -n 1)
          gem push --key codeartifact_api_key --host "${CODEARTIFACT_REPOSITORY}" "${GEM_FILE}"

